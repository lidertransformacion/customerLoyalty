# The Chile menu: every push to `menuChile` builds web/ in menu mode for the Chilean market,
# runs its tests and copies dist/ over rsync to the nginx root on the EC2 server. Only that branch
# publishes: a manual run from any other branch builds and tests and stops there.
# Until the server secret and variables exist in the repository, the build and tests still run
# and the publish steps are skipped (see web/README.md, "Despliegue del menú de Chile").
name: Deploy Chile menu

on:
  push:
    branches: [menuChile]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chile-menu
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      SERVER_KEY: ${{ secrets.EC2_SSH_KEY }}
      SERVER_HOST: ${{ vars.EC2_HOST }}
      SERVER_USER: ${{ vars.EC2_USER }}
      SERVER_PATH: ${{ vars.EC2_PATH }}
      SERVER_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The shared modules under the repository root (src/data, src/i18n, src/format) sit beside
      # the Expo app's tsconfig.json, which extends expo/tsconfig.base. The Expo app is not installed
      # here, so Vite gets the two fields esbuild reads from that base in its place.
      - name: Stand in for the Expo tsconfig base
        working-directory: .
        run: |
          mkdir -p node_modules/expo
          echo '{ "compilerOptions": { "jsx": "react-jsx", "target": "ESNext" } }' > node_modules/expo/tsconfig.base.json

      - run: npm test

      - name: Build the menu for Chile
        run: npm run build
        env:
          VITE_APP_MODE: menu
          VITE_MARKET: CL
          EXPO_PUBLIC_ODOO_URL: ""

      - name: Explain a skipped publish
        if: github.ref != 'refs/heads/menuChile' || env.SERVER_KEY == '' || env.SERVER_HOST == '' || env.SERVER_USER == '' || env.SERVER_PATH == ''
        run: |
          echo "::notice::Built and tested, not published: only menuChile publishes, and it needs the EC2_SSH_KEY secret and the EC2_HOST, EC2_USER, EC2_PATH and EC2_KNOWN_HOSTS variables (web/README.md)."

      - name: Open the door to the server
        if: github.ref == 'refs/heads/menuChile' && env.SERVER_KEY != '' && env.SERVER_HOST != '' && env.SERVER_USER != '' && env.SERVER_PATH != ''
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$SERVER_KNOWN_HOSTS" ]; then printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -t ed25519 "$SERVER_HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload the site
        if: github.ref == 'refs/heads/menuChile' && env.SERVER_KEY != '' && env.SERVER_HOST != '' && env.SERVER_USER != '' && env.SERVER_PATH != ''
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # Hashed bundles: the new ones go up and stale ones go.
          rsync -az --delete -e "$SSH" dist/assets/ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/assets/"
          # Everything else, without deleting: replaced photographs carry a new name and the old
          # names stay for phones that still ask for them. _redirects belongs to Cloudflare Pages.
          rsync -az -e "$SSH" --exclude assets --exclude _redirects dist/ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"
          echo "Published to ${{ vars.SITE_URL || format('http://{0}/', env.SERVER_HOST) }}"
